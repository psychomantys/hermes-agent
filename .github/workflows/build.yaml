name: Build
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write
jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - id: meta
        run: |
          export GITHUB_REPOSITORY_NAME="${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          name="$(echo "${GITHUB_REPOSITORY_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${name}" >> "${GITHUB_OUTPUT}"

  build-images:
    name: build ${{ needs.meta.outputs.name }} (${{ matrix.platform }})
    needs: meta
    strategy:
      matrix:
        include:
          - file: Dockerfile
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - file: Dockerfile
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.meta.outputs.image }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.meta.outputs.image }}:buildcache-${{ matrix.arch }},mode=max
      - name: Attest architecture image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify ${{ needs.meta.outputs.name }} image contents
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
        run: |
          docker pull "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker run --rm --entrypoint '' "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            sh -c 'command -v hermes >/dev/null && command -v agent >/dev/null && command -v pre-commit >/dev/null'
          docker run --rm --entrypoint '' "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            /opt/hermes/.venv/bin/python -c 'import faster_whisper; print(faster_whisper.__version__)'

  publish:
    needs: [meta, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture image manifests
        id: manifest
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{ .Manifest.Digest }}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest multi-architecture image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.meta.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
